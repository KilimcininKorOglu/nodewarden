name: Sync upstream

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

env:
  UPSTREAM: https://github.com/shuaiplus/nodewarden.git
  # Files this fork changes. A conflict in one of them is resolved by taking
  # upstream's copy wholesale and re-applying the fork changes with
  # scripts/apply-fork-patches.cjs, so upstream's work is never dropped.
  FORK_OWNED: "package.json package-lock.json wrangler.kv.toml src/config-response.ts"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM" || git remote set-url upstream "$UPSTREAM"
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          echo "Fork is ${behind} commit(s) behind upstream."

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          set +e
          git merge --no-edit upstream/main
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "resolved=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U)
          conflict_list=$(printf '%s' "$conflicts" | tr '\n' ' ')
          foreign=""
          for f in $conflicts; do
            case " $FORK_OWNED " in
              *" $f "*) ;;
              *) foreign="${foreign}${f} " ;;
            esac
          done

          if [ -n "$foreign" ]; then
            git merge --abort
            {
              echo "conflicts=${conflict_list}"
              echo "foreign=${foreign}"
              echo "resolved=no"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every conflict is in a file this fork owns. Take upstream's copy;
          # the next step writes the fork changes back on top of it.
          for f in $conflicts; do
            git checkout upstream/main -- "$f"
            git add "$f"
          done
          {
            echo "resolved=autoresolved"
            echo "conflicts=${conflict_list}"
          } >> "$GITHUB_OUTPUT"

      - name: Re-apply fork patches
        if: steps.merge.outputs.resolved == 'clean' || steps.merge.outputs.resolved == 'autoresolved'
        run: |
          node scripts/normalize-lock.cjs
          node scripts/apply-fork-patches.cjs

          # A clean merge can still drop a fork change without a conflict, for
          # example when upstream rewrites the whole featureStates object.
          if [ -n "$(git diff --name-only)" ]; then
            read -r -a owned <<< "$FORK_OWNED"
            git add -- "${owned[@]}"
          fi

          if [ -f .git/MERGE_HEAD ]; then
            git commit --no-edit
          elif [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "chore: re-apply fork patches after upstream merge"
          fi

      - name: Verify fork patches survived the merge
        if: steps.merge.outputs.resolved == 'clean' || steps.merge.outputs.resolved == 'autoresolved'
        run: node scripts/apply-fork-patches.cjs --check

      - name: Push merged changes
        if: steps.merge.outputs.resolved == 'clean' || steps.merge.outputs.resolved == 'autoresolved'
        run: git push origin main

      - name: Deploy the merged code
        if: steps.merge.outputs.resolved == 'clean' || steps.merge.outputs.resolved == 'autoresolved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A push made with GITHUB_TOKEN starts no other workflow, so the push
        # above never triggers deploy.yml and the merge would sit undeployed.
        # workflow_dispatch is the one event GITHUB_TOKEN is allowed to start.
        run: gh workflow run deploy.yml --ref main

      - name: Close a stale conflict issue
        if: steps.merge.outputs.resolved == 'clean' || steps.merge.outputs.resolved == 'autoresolved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --label upstream-sync --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The upstream sync merged and pushed successfully, so this is resolved."
          fi

      - name: Report an unresolvable conflict
        if: steps.merge.outputs.resolved == 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          FOREIGN: ${{ steps.merge.outputs.foreign }}
          BEHIND: ${{ steps.check.outputs.behind }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Quoted heredocs keep the Markdown backticks literal; only the table
          # rows interpolate values, and they go through printf.
          {
            cat <<'EOF'
          The scheduled upstream sync could not merge `upstream/main`. The merge was aborted, so `main` is unchanged and nothing was deployed. **The vault is running older code than upstream until this is resolved.**

          | | |
          |---|---|
          EOF
            printf '| Commits behind upstream | %s |\n' "$BEHIND"
            printf '| Conflicting files | %s |\n' "$CONFLICTS"
            printf '| Not auto-resolvable | %s |\n' "$FOREIGN"
            printf '| Run | %s |\n\n' "$RUN_URL"
            cat <<'EOF'
          Conflicts in the fork-owned files are resolved automatically. The files above are outside that set, so upstream changed something this fork also changed in a way no script can reconcile.

          Resolve locally:

              git fetch upstream main
              git merge upstream/main
              # resolve the conflicts, then
              node scripts/apply-fork-patches.cjs --check
              git push origin main

          The push triggers the deploy workflow.
          EOF
          } > /tmp/issue-body.md

          # --force updates the label when it already exists instead of failing.
          gh label create upstream-sync --color B60205 --description "Upstream sync is blocked" --force

          existing=$(gh issue list --state open --label upstream-sync --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
            gh issue edit "$existing" --title "Upstream sync blocked: ${BEHIND} commit(s) behind"
          else
            gh issue create \
              --label upstream-sync \
              --title "Upstream sync blocked: ${BEHIND} commit(s) behind" \
              --body-file /tmp/issue-body.md
          fi

          # Fail the run so the red check and its notification reach the owner.
          # A green run for a blocked sync is how an unapplied upstream fix
          # goes unnoticed for days.
          echo "::error::Upstream sync is blocked; ${BEHIND} commit(s) are not merged."
          exit 1
