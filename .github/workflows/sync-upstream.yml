name: Sync upstream

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM: https://github.com/shuaiplus/nodewarden.git

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM" || git remote set-url upstream "$UPSTREAM"
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          echo "Fork is ${behind} commit(s) behind upstream."

      - name: Merge upstream
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          set +e
          git merge --no-edit upstream/main
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            # The lockfile conflicts on every upstream dependency bump because this
            # fork rewrites its registry host. Take upstream's lockfile wholesale
            # and re-apply the rewrite, so only real code conflicts stop the sync.
            if [ "$(git diff --name-only --diff-filter=U)" = "package-lock.json" ]; then
              git checkout --theirs package-lock.json
              node scripts/normalize-lock.cjs
              git add package-lock.json
              git commit --no-edit
              echo "resolved=lockfile" >> "$GITHUB_OUTPUT"
            else
              conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              git merge --abort
              echo "conflicts=${conflicts}" >> "$GITHUB_OUTPUT"
              echo "resolved=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "resolved=clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged changes
        if: steps.merge.outputs.resolved == 'clean' || steps.merge.outputs.resolved == 'lockfile'
        run: git push origin main

      - name: Open issue on conflict
        if: steps.merge.outputs.resolved == 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          {
            printf 'The scheduled upstream sync could not merge `upstream/main`. The merge was aborted, so `main` is unchanged and nothing was deployed.\n\n'
            printf '**Commits behind upstream:** %s\n' "$BEHIND"
            printf '**Conflicting files:** `%s`\n\n' "$CONFLICTS"
            printf 'Resolve locally:\n\n'
            printf '    git fetch upstream main\n'
            printf '    git merge upstream/main\n'
            printf '    # resolve the conflicts, then\n'
            printf '    git push origin main\n\n'
            printf 'The push triggers the deploy workflow.\n'
          } > /tmp/issue-body.md
          gh issue create \
            --title "Upstream sync blocked by merge conflict" \
            --body-file /tmp/issue-body.md
