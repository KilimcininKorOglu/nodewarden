name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Normalize lockfile registry
        run: node scripts/normalize-lock.cjs

      - name: Verify the fork patches are in place
        # Refuses to deploy a tree that lost a fork change, whatever put it
        # there: an upstream merge, a hand edit, a bad rebase.
        run: node scripts/apply-fork-patches.cjs --check

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # ensure-d1.cjs runs as its own step instead of inside the deploy:kv
        # script, so package.json keeps upstream's value and cannot conflict.
        run: |
          node scripts/ensure-d1.cjs
          npm run deploy:kv

      - name: Smoke test
        env:
          VAULT_URL: ${{ vars.VAULT_URL }}
          MTLS_CLIENT_CERT: ${{ secrets.MTLS_CLIENT_CERT }}
          MTLS_CLIENT_KEY: ${{ secrets.MTLS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          url="${VAULT_URL:-https://cuzdan.keremgok.tr}"

          # The vault sits behind mTLS at the Cloudflare edge, so this job needs its
          # own client certificate. Without one every probe below would be a 403 and
          # the test would say nothing about whether the Worker actually came up.
          umask 077
          printf '%s' "$MTLS_CLIENT_CERT" > /tmp/ci.crt
          printf '%s' "$MTLS_CLIENT_KEY" > /tmp/ci.key
          curl_mtls() { curl -sS --cert /tmp/ci.crt --key /tmp/ci.key "$@"; }

          # mTLS must actually reject an uncertified request. A rule that silently
          # stops matching would leave the vault open with every other check green.
          bare=$(curl -sS -o /dev/null -w '%{http_code}' "${url}/api/config" || echo 000)
          if [ "$bare" != "403" ]; then
            echo "mTLS is not enforcing: /api/config without a certificate returned ${bare}, expected 403"
            exit 1
          fi
          echo "mTLS enforced (uncertified request blocked)"

          # Over HTTP/3 the client certificate is not verified, so a browser that
          # upgrades through Alt-Svc gets 403 on every request. An h3 Alt-Svc
          # header means someone turned HTTP/3 back on for the zone.
          alt=$(curl_mtls -o /dev/null -D - "${url}/api/config" | tr -d '\r' | awk 'tolower($1)=="alt-svc:"{print}')
          if printf '%s' "$alt" | grep -q 'h3'; then
            echo "HTTP/3 is advertised (${alt}); turn HTTP/3 off for the zone, it breaks mTLS clients"
            exit 1
          fi
          echo "HTTP/3 not advertised"

          echo "Probing ${url}/api/config"
          for attempt in 1 2 3 4 5; do
            code=$(curl_mtls -o /tmp/config.json -w '%{http_code}' "${url}/api/config" || echo 000)
            if [ "$code" = "200" ]; then
              node -e '
                const c = require("/tmp/config.json");
                if (c.object !== "config") throw new Error("unexpected payload: " + JSON.stringify(c).slice(0, 200));
                if (!c.environment || !c.environment.vault) throw new Error("config has no environment.vault");
                // This fork adds mutual-tls so the Android client shows its client-certificate
                // screen. An upstream merge that rewrites featureStates could drop it silently,
                // and the only symptom would be a missing screen on one platform.
                if (c.featureStates?.["mutual-tls"] !== true) {
                  throw new Error("featureStates is missing mutual-tls; an upstream merge probably dropped it");
                }
                console.log("config ok, version " + c.version);
              '
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}, retrying in 10s"
            sleep 10
          done
          echo "Smoke test failed: /api/config never returned 200"
          exit 1

      - name: Ensure the workers.dev route stays closed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # workers.dev bypasses the zone, and with it the mTLS rule. A deploy that
          # re-enables that route would reopen the vault to the whole internet while
          # every other check still passes.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            https://nodewarden.hermesthecat.workers.dev/api/config || echo 000)
          if [ "$code" = "200" ]; then
            echo "workers.dev is serving the vault and bypasses mTLS; disable it in the Worker settings"
            exit 1
          fi
          echo "workers.dev closed (HTTP ${code})"
