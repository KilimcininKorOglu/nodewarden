name: Cleanup artifacts

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Delete artifacts older than this many days"
        required: false
        default: "7"
        type: string

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete expired workflow artifacts
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const retainDays = Number(context.payload.inputs?.retain_days ?? 7);
            const cutoff = Date.now() - retainDays * 24 * 60 * 60 * 1000;
            let deleted = 0;
            let bytes = 0;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            for (const artifact of artifacts) {
              if (artifact.expired) continue;
              if (Date.parse(artifact.created_at) >= cutoff) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted += 1;
              bytes += artifact.size_in_bytes ?? 0;
            }

            const mb = (bytes / 1024 / 1024).toFixed(1);
            core.info(`Deleted ${deleted} artifact(s) older than ${retainDays} day(s), freeing ${mb} MB.`);
            core.summary
              .addHeading('Artifact cleanup')
              .addRaw(`Deleted **${deleted}** artifact(s) older than ${retainDays} day(s), freeing **${mb} MB**.`)
              .write();
